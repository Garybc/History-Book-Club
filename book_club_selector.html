<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Card Catalog — Reading Group Book Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16302b;
    --bg-deep: #0e211d;
    --kraft: #e8dcc0;
    --kraft-alt: #f1e9d2;
    --ink: #23291f;
    --cream: #efe8d6;
    --brass: #b08d57;
    --brass-dim: #8a7148;
    --stamp: #a23b2e;
    --stamp-dark: #7e2c22;
    --muted: #93a89b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #1c3d36 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color:var(--cream);
    font-family:'Lora', serif;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}

  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--brass-dim);
    padding-bottom:14px;margin-bottom:6px;flex-wrap:wrap;gap:10px;
  }
  header.top h1{font-size:26px;font-weight:600;margin:0;letter-spacing:.3px;}
  header.top .call-number{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:1px;}
  .tagline{font-size:13px;color:var(--muted);margin:2px 0 26px;font-style:italic;}

  .group-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    margin-bottom:20px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);
  }
  .group-row .group-name{color:var(--brass);text-transform:uppercase;letter-spacing:.6px;}
  .group-row button.switch{
    background:transparent;border:1px solid var(--brass-dim);color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 10px;border-radius:4px;cursor:pointer;
  }
  .group-row button.switch:hover{color:var(--cream);border-color:var(--brass);}

  .name-row{display:flex;gap:10px;align-items:center;margin-bottom:22px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .name-row input{background:transparent;border:none;border-bottom:1px solid var(--brass-dim);color:var(--cream);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:4px 2px;width:160px;outline:none;}
  .name-row input:focus{border-bottom-color:var(--brass);}

  nav.drawers{display:flex;gap:6px;margin-bottom:28px;}
  nav.drawers button{flex:1;background:var(--bg-deep);border:1px solid var(--brass-dim);border-bottom:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:10px 8px;cursor:pointer;border-radius:4px 4px 0 0;transition:background .15s, color .15s;}
  nav.drawers button.active{background:var(--kraft);color:var(--ink);border-color:var(--brass);}
  nav.drawers button:not(.active):hover{color:var(--cream);}

  .panel{background:var(--kraft);color:var(--ink);border-radius:2px 10px 10px 10px;padding:26px;box-shadow:0 12px 30px rgba(0,0,0,.35);}

  label.field{display:block;margin-bottom:16px;}
  label.field span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--brass-dim);margin-bottom:5px;}
  input[type=text], textarea, select{width:100%;background:var(--kraft-alt);border:1px solid #c9bb96;border-radius:3px;padding:9px 10px;font-family:'Lora',serif;font-size:14.5px;color:var(--ink);outline:none;}
  input[type=text]:focus, textarea:focus{border-color:var(--brass);}
  textarea{resize:vertical;min-height:52px;}
  textarea.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}

  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.6px;text-transform:uppercase;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--stamp);color:var(--kraft-alt);}
  .btn-primary:hover{background:var(--stamp-dark);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:transparent;border:1px solid var(--brass-dim);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--brass);}
  .btn-small{font-size:10.5px;padding:6px 10px;}

  .empty{text-align:center;color:var(--brass-dim);font-style:italic;padding:40px 10px;font-size:14px;}

  .card{background:var(--kraft-alt);border:1px solid #cabb94;border-radius:2px;padding:16px 18px 14px;margin-bottom:16px;position:relative;}
  .card::before{content:"";position:absolute;top:0;left:22px;width:38px;height:6px;background:var(--brass-dim);border-radius:0 0 3px 3px;opacity:.55;}
  .card .dewey{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-dim);letter-spacing:.5px;margin-bottom:6px;}
  .card h3{margin:0 0 2px;font-size:18px;font-weight:600;}
  .card .author{font-size:13px;color:#5b5340;font-style:italic;margin-bottom:6px;}
  .card .theme{font-size:12.5px;color:var(--ink);margin-bottom:8px;}
  .card .theme b{color:var(--brass-dim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-style:normal;margin-right:6px;}
  .card .notes{font-size:12.5px;color:var(--ink);margin-bottom:8px;line-height:1.5;background:#fbf6e8;border-left:2px solid var(--brass-dim);padding:7px 10px;border-radius:0 3px 3px 0;}
  .card .notes b{display:block;color:var(--brass-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-style:normal;margin-bottom:3px;}
  .card a.link{font-size:12px;color:var(--stamp);text-decoration:none;font-family:'IBM Plex Mono',monospace;}
  .card a.link:hover{text-decoration:underline;}
  .card .meta{font-size:11px;color:#8a8262;margin-top:8px;font-family:'IBM Plex Mono',monospace;}
  .card .row-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .card .enrich-status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-dim);font-style:italic;}

  .stamp-badge{position:absolute;top:12px;right:14px;border:2px solid var(--stamp);color:var(--stamp);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;transform:rotate(6deg);letter-spacing:.5px;}

  .rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .rate-field{background:#fbf6e8;border:1px dashed #cabb94;border-radius:4px;padding:8px 10px;}
  .rate-field span{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--brass-dim);letter-spacing:.5px;margin-bottom:4px;}
  input[type=range]{width:100%;accent-color:var(--stamp);}
  .range-val{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);float:right;}

  .flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .flags label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#fbf6e8;border:1px solid #cabb94;border-radius:12px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--ink);}
  .flags input{accent-color:var(--stamp);}

  .save-row{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;}

  .results-card{background:var(--kraft-alt);border:1px solid #cabb94;border-radius:2px;padding:16px 18px;margin-bottom:14px;}
  .results-card h3{margin:0 0 8px;font-size:17px;}
  .stat-row{display:flex;flex-wrap:wrap;gap:18px;margin:10px 0 8px;}
  .stat{font-family:'IBM Plex Mono',monospace;}
  .stat .num{font-size:20px;font-weight:600;color:var(--stamp);display:block;}
  .stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brass-dim);}
  .bar-track{background:#e2d6b4;border-radius:6px;height:8px;overflow:hidden;margin-top:4px;}
  .bar-fill{background:var(--stamp);height:100%;}
  .flagchip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;background:#f0e2c4;border:1px solid #cabb94;border-radius:10px;padding:3px 8px;margin:2px 4px 0 0;color:#5b5340;}
  .weight-panel{display:flex;gap:20px;flex-wrap:wrap;background:var(--bg-deep);border:1px solid var(--brass-dim);border-radius:8px;padding:14px 18px;margin-bottom:18px;}
  .weight-panel .wf{flex:1;min-width:140px;}
  .weight-panel span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .rank-num{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--brass);font-size:13px;margin-right:8px;}
  .loading{color:var(--muted);font-style:italic;font-size:13px;text-align:center;padding:20px;}

  .banner-error{background:#7e2c22;color:#f1e9d2;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:14px 18px;border-radius:6px;margin-bottom:20px;line-height:1.6;}

  /* gate screen */
  .gate-wrap{max-width:520px;margin:60px auto;text-align:center;}
  .gate-wrap h1{font-size:28px;margin-bottom:6px;}
  .gate-wrap .tagline{margin-bottom:30px;}
  .gate-panel{background:var(--kraft);color:var(--ink);border-radius:2px 10px 10px 10px;padding:26px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.35);}
  .gate-section-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--brass-dim);margin-bottom:10px;}
  .catalog-btn{display:block;width:100%;text-align:left;background:var(--kraft-alt);border:1px solid #cabb94;border-radius:4px;padding:12px 14px;margin-bottom:8px;font-family:'Lora',serif;font-size:14.5px;color:var(--ink);cursor:pointer;}
  .catalog-btn:hover{border-color:var(--stamp);}
  .catalog-btn .sub{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8a8262;margin-top:2px;}
  .new-group-row{display:flex;gap:8px;}
  .new-group-row input{flex:1;}

  /* bulk import */
  .bulk-toggle{background:none;border:none;color:var(--stamp);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:14px;}
  .bulk-box{background:var(--kraft-alt);border:1px dashed #cabb94;border-radius:6px;padding:14px;margin-bottom:20px;}
  .bulk-box .hint{font-size:11.5px;color:#5b5340;margin-bottom:8px;line-height:1.5;}
  .bulk-preview{margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b5340;}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  const state = {
    tab:'submit', name:'', catalog:null, catalogs:[], catalogsLoaded:false,
    books:[], ratings:[], loaded:false,
    weights:{interest:1, ease:0.6, votes:0.4},
    bulkMode:false, apiError:null
  };

  const CONTENT_FLAGS = ["violence","language","sexual content","drug use","dark/heavy themes"];

  function id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || id(); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }
  function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
  function deweyFor(str){
    let h = 0;
    for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
    const num = (h % 900) + 100;
    const letters = str.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase() || 'XX';
    return num + '.' + (h%99) + ' ' + letters;
  }

  // ---------- Sheets API backend ----------
  // Paste the URL you get after deploying Code.gs as a Web App here:
  const API_URL = "https://script.google.com/macros/s/AKfycby8y1p3tjMcq9SrKH8eVHaeFDUuOnKm6ebN-gQaBETe9HHig9qynPYcVZEsdu9ESypnWA/exec";

  async function api(action, params){
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
      body: JSON.stringify(Object.assign({ action }, params))
    });
    const json = await resp.json();
    if(!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  }

  async function loadCatalogs(){
    try{ state.catalogs = await api('listCatalogs', {}); }
    catch(e){ console.error('loadCatalogs failed', e); state.catalogs = []; state.apiError = e.message; }
    state.catalogsLoaded = true;
  }
  async function createCatalog(name){
    return await api('createCatalog', { name, createdBy: state.name || 'unknown' });
  }

  async function loadAll(){
    const slug = state.catalog.slug;
    try{
      const books = await api('listBooks', { catalogSlug: slug });
      const ratings = await api('listRatings', { catalogSlug: slug });
      books.sort((a,b)=> a.ts - b.ts);
      state.books = books;
      state.ratings = ratings;
    }catch(e){ console.error('load error', e); }
    state.loaded = true;
    render();
  }

  async function saveBook(book){
    await api('saveBook', { catalogSlug: state.catalog.slug, book });
  }
  async function saveRating(rating){
    await api('saveRating', { catalogSlug: state.catalog.slug, rating });
  }
  function ratingsFor(bookId){ return state.ratings.filter(r=>r.bookId===bookId); }

  // ---------- AI-assisted lookup ----------
  function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

  async function enrichBook(book, statusEl, opts){
    opts = opts || {};
    const maxRetries = opts.maxRetries != null ? opts.maxRetries : 1;
    let attempt = 0;
    while(true){
      try{
        statusEl.textContent = attempt>0 ? 'Retrying…' : 'Looking up details…';
        const parsed = await api('enrich', { title: book.title, author: book.author });
        if(parsed.link && !book.link) book.link = parsed.link;
        if(parsed.theme && !book.theme) book.theme = parsed.theme;
        if(parsed.notes && !book.notes) book.notes = parsed.notes;
        await saveBook(book);
        const idx = state.books.findIndex(b=>b.id===book.id);
        if(idx>=0) state.books[idx] = book;
        statusEl.textContent = 'Updated.';
        return true;
      }catch(e){
        const msg = String(e.message || e);
        const isRateLimit = /rate.?limit|429|overloaded/i.test(msg);
        if(isRateLimit && attempt < maxRetries){
          statusEl.textContent = 'Rate limited — waiting before retrying…';
          await sleep(8000);
          attempt++;
          continue;
        }
        console.error('enrich failed', e);
        statusEl.textContent = isRateLimit
          ? 'Rate limited — skipped for now, try again in a minute.'
          : (msg.includes('ANTHROPIC_API_KEY') ? "AI lookup isn't configured (needs an API key in the Sheet's Apps Script)." : "Couldn't look this up: " + msg);
        return false;
      }
    }
  }

  async function deleteBook(book, panel){
    if(!confirm(`Remove "${book.title}" from the shelf? This also deletes any ratings on it.`)) return;
    try{
      await api('deleteBook', { catalogSlug: state.catalog.slug, bookId: book.id });
      state.books = state.books.filter(b=>b.id!==book.id);
      state.ratings = state.ratings.filter(r=>r.bookId!==book.id);
      renderPanel();
    }catch(e){
      console.error('delete failed', e);
      alert("Couldn't delete this — " + e.message);
    }
  }

  // ---------- bulk import ----------
  function parseBulkText(text){
    return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
      if(line.includes('|')){
        const parts = line.split('|').map(p=>p.trim());
        return { title: parts[0]||'', author: parts[1]||'', theme: parts[2]||'', notes: parts[3]||'', link: parts[4]||'' };
      }
      const m = line.match(/^(.+?)\s+by\s+(.+)$/i);
      if(m) return { title: m[1].trim(), author: m[2].trim(), theme:'', notes:'', link:'' };
      return { title: line, author:'', theme:'', notes:'', link:'' };
    }).filter(b=>b.title);
  }

  // ---------- render dispatch ----------
  function render(){
    const root = document.getElementById('root');
    if(!state.catalogsLoaded){
      root.innerHTML = '<div class="wrap"><div class="loading">Opening the catalog room…</div></div>';
      return;
    }
    if(!state.catalog){ renderGate(root); return; }
    renderMain(root);
  }

  function renderGate(root){
    root.innerHTML = `
      <div class="wrap">
        <div class="gate-wrap">
          <h1>The Card Catalog</h1>
          <div class="tagline">One picker, any reading group. Choose your group's shelf or start a new one.</div>
          <div class="gate-panel">
            <div class="gate-section-label">Existing reading groups</div>
            ${state.catalogs.length ? state.catalogs.map(c=>`
              <button class="catalog-btn" data-slug="${escapeAttr(c.slug)}">
                ${escapeHtml(c.name)}
                <span class="sub">created ${new Date(c.ts).toLocaleDateString()}${c.createdBy ? ' by '+escapeHtml(c.createdBy) : ''}</span>
              </button>
            `).join('') : '<div class="empty">No groups yet — create the first one below.</div>'}
            <div class="gate-section-label" style="margin-top:22px;">Start a new reading group</div>
            <div class="new-group-row">
              <input type="text" id="newCatalogName" placeholder="e.g. History Book Club">
              <button class="btn btn-primary" id="createCatalogBtn">Create</button>
            </div>
          </div>
        </div>
      </div>
    `;
    root.querySelectorAll('.catalog-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const c = state.catalogs.find(c=>c.slug===btn.dataset.slug);
        state.catalog = c; state.loaded = false; render(); loadAll();
      });
    });
    document.getElementById('createCatalogBtn').addEventListener('click', async ()=>{
      const nameInput = document.getElementById('newCatalogName');
      const name = nameInput.value.trim();
      if(!name){ alert('Give the reading group a name first.'); return; }
      const btn = document.getElementById('createCatalogBtn');
      btn.textContent = 'Creating…'; btn.disabled = true;
      try{
        const c = await createCatalog(name);
        state.catalog = c; state.loaded = false; render(); loadAll();
      }catch(e){
        console.error(e);
        btn.textContent = 'Create'; btn.disabled = false;
        alert("Couldn't create the group — " + e.message);
      }
    });
  }

  function renderMain(root){
    root.innerHTML = `
      <div class="wrap">
        <header class="top">
          <h1>The Card Catalog</h1>
          <div class="call-number" id="dateStamp"></div>
        </header>
        <div class="tagline">Submit a title, rate what's on the shelf, let the numbers pick the next read.</div>
        <div class="group-row">
          <div>Reading group: <span class="group-name">${escapeHtml(state.catalog.name)}</span></div>
          <button class="switch" id="switchGroupBtn">Switch group</button>
        </div>
        <div class="name-row">
          <span>READER OF RECORD:</span>
          <input type="text" id="nameInput" value="${escapeAttr(state.name)}" placeholder="your name">
        </div>
        <nav class="drawers">
          <button data-tab="submit" class="${state.tab==='submit'?'active':''}">Submit Books</button>
          <button data-tab="rate" class="${state.tab==='rate'?'active':''}">Rate &amp; Vote</button>
          <button data-tab="results" class="${state.tab==='results'?'active':''}">Results</button>
        </nav>
        <div class="panel" id="panel"></div>
      </div>
    `;
    document.getElementById('dateStamp').textContent = new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase();
    document.getElementById('nameInput').addEventListener('input', e=>{ state.name = e.target.value.trim(); });
    document.getElementById('switchGroupBtn').addEventListener('click', ()=>{
      state.catalog = null; state.loaded = false; state.books=[]; state.ratings=[];
      render();
    });
    root.querySelectorAll('nav.drawers button').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; renderMain(root); renderPanel(); });
    });
    renderPanel();
  }

  function renderPanel(){
    const panel = document.getElementById('panel');
    if(!state.loaded){ panel.innerHTML = '<div class="loading">Pulling the drawer open…</div>'; return; }
    if(state.tab === 'submit') return renderSubmit(panel);
    if(state.tab === 'rate') return renderRate(panel);
    if(state.tab === 'results') return renderResults(panel);
  }

  // ---------- Submit tab ----------
  function renderSubmit(panel){
    const needsFill = state.books.filter(b => !b.link || !b.theme || !b.notes);
    panel.innerHTML = `
      <button class="bulk-toggle" id="bulkToggle">${state.bulkMode ? '← Back to single entry' : 'Bulk import from a list →'}</button>
      ${state.bulkMode ? bulkImportHtml() : singleFormHtml()}
      <div class="card-list" style="margin-top:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-dim);text-transform:uppercase;letter-spacing:.6px;">On the shelf (${state.books.length})</div>
          ${needsFill.length ? `<button class="btn btn-ghost btn-small" id="autofillAllBtn">✨ Auto-fill all missing details (${needsFill.length})</button>` : ''}
        </div>
        <div class="bulk-preview" id="autofillProgress" style="margin-bottom:10px;"></div>
        ${state.books.length ? state.books.map(bookCardHtml).join('') : '<div class="empty">No cards filed yet — be the first.</div>'}
      </div>
    `;
    document.getElementById('bulkToggle').addEventListener('click', ()=>{ state.bulkMode = !state.bulkMode; renderSubmit(panel); });

    if(needsFill.length){
      document.getElementById('autofillAllBtn').addEventListener('click', async ()=>{
        const btn = document.getElementById('autofillAllBtn');
        const progressEl = document.getElementById('autofillProgress');
        btn.disabled = true;
        let done = 0, skipped = 0;
        for(const book of needsFill){
          progressEl.textContent = `Auto-filling ${done+skipped+1} of ${needsFill.length}…`;
          let status = document.getElementById('enrich-status-'+book.id);
          if(!status){ status = { textContent:'' }; } // card may not be in DOM after a re-render mid-loop; degrade gracefully
          const ok = await enrichBook(book, status, {maxRetries:1});
          if(ok) done++; else skipped++;
          await sleep(1200); // pace requests to avoid re-triggering rate limits
        }
        progressEl.textContent = `Done: ${done} updated${skipped ? `, ${skipped} skipped (rate limited or no session)` : ''}.`;
        renderSubmit(panel);
      });
    }


    if(state.bulkMode){
      document.getElementById('bulkSubmitBtn').addEventListener('click', async ()=>{
        if(!state.name){ alert("Enter your name up top first — that's how we credit the submissions."); return; }
        const raw = document.getElementById('bulkText').value;
        const parsed = parseBulkText(raw);
        if(!parsed.length){ alert('Nothing to import — check the format.'); return; }
        const btn = document.getElementById('bulkSubmitBtn');
        btn.textContent = 'Filing…'; btn.disabled = true;
        let done = 0;
        const failures = [];
        for(const p of parsed){
          const book = { id:id(), title:p.title, author:p.author, link:p.link, theme:p.theme, notes:p.notes, addedBy:state.name, ts:Date.now() };
          btn.textContent = `Filing ${done+failures.length+1} of ${parsed.length}…`;
          try{
            await saveBook(book);
            state.books.push(book);
            done++;
          }catch(e){
            console.error('saveBook failed for', p.title, e);
            failures.push({ title: p.title, error: e.message || String(e) });
          }
        }
        btn.textContent = 'Import Books'; btn.disabled = false;
        if(failures.length){
          alert(
            `Imported ${done} of ${parsed.length}.\n\n` +
            `Failed:\n` + failures.map(f=>`• ${f.title} — ${f.error}`).join('\n') +
            `\n\nCheck the API_URL is correct and the Apps Script is deployed with "Who has access: Anyone", then try the failed ones again.`
          );
        }
        if(done > 0){ state.bulkMode = false; }
        renderSubmit(panel);
      });
      document.getElementById('bulkText').addEventListener('input', ()=>{
        const p = parseBulkText(document.getElementById('bulkText').value);
        document.getElementById('bulkPreview').textContent = p.length ? `${p.length} book(s) detected` : '';
      });
      return;
    }

    document.getElementById('submitBtn').addEventListener('click', async ()=>{
      const title = document.getElementById('f-title').value.trim();
      const author = document.getElementById('f-author').value.trim();
      const link = document.getElementById('f-link').value.trim();
      const theme = document.getElementById('f-theme').value.trim();
      const notes = document.getElementById('f-notes').value.trim();
      if(!title){ alert('A title is required.'); return; }
      if(!state.name){ alert("Enter your name up top first — that's how we credit the submission."); return; }
      const book = { id:id(), title, author, link, theme, notes, addedBy:state.name, ts:Date.now() };
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Filing…'; btn.disabled = true;
      try{
        await saveBook(book);
        state.books.push(book);
        renderSubmit(panel);
      }catch(e){
        console.error('saveBook failed', e);
        btn.textContent = 'File Card'; btn.disabled = false;
        alert("Couldn't save this card — " + e.message);
      }
    });
  }

  function singleFormHtml(){
    return `
      <label class="field"><span>Title</span><input type="text" id="f-title" placeholder="e.g. The Left Hand of Darkness"></label>
      <label class="field"><span>Author</span><input type="text" id="f-author" placeholder="e.g. Ursula K. Le Guin"></label>
      <label class="field"><span>Link (optional)</span><input type="text" id="f-link" placeholder="Goodreads / store link"></label>
      <label class="field"><span>Theme</span><input type="text" id="f-theme" placeholder="e.g. isolation, gender, first contact"></label>
      <label class="field"><span>Notes (optional)</span><textarea id="f-notes" rows="3" placeholder="Major points, why it's a good pick, what to expect — anything a voter should know before rating"></textarea></label>
      <div class="save-row"><button class="btn btn-primary" id="submitBtn">File Card</button></div>
    `;
  }

  function bulkImportHtml(){
    return `
      <div class="bulk-box">
        <div class="hint">
          One book per line. Use <b>Title | Author | Theme</b> (theme optional), or just <b>Title by Author</b>, or a bare title.<br>
          Example:<br>
          <code>Upheaval | Jared Diamond | national crisis and resilience</code><br>
          <code>The Last Emperor of Mexico by Edward Shawcross</code>
        </div>
        <textarea class="mono" id="bulkText" rows="8" placeholder="Paste your list here, one book per line…"></textarea>
        <div class="bulk-preview" id="bulkPreview"></div>
        <div class="save-row"><button class="btn btn-primary" id="bulkSubmitBtn">Import Books</button></div>
      </div>
    `;
  }

  function bookCardHtml(b){
    return `
      <div class="card" data-book="${b.id}">
        <div class="dewey">${deweyFor(b.title+b.author)}</div>
        <h3>${escapeHtml(b.title)}</h3>
        <div class="author">${escapeHtml(b.author||'unknown author')}</div>
        ${b.theme ? `<div class="theme"><b>theme</b>${escapeHtml(b.theme)}</div>` : ''}
        ${b.notes ? `<div class="notes"><b>notes</b>${escapeHtml(b.notes)}</div>` : ''}
        ${b.link ? `<a class="link" href="${escapeAttr(b.link)}" target="_blank" rel="noopener">→ ${escapeHtml(b.link)}</a>` : ''}
        <div class="meta">filed by ${escapeHtml(b.addedBy)} · ${new Date(b.ts).toLocaleDateString()}</div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-small" data-enrich="${b.id}">🔍 Auto-fill details (AI)</button>
          <button class="btn btn-ghost btn-small" data-delete="${b.id}" style="border-color:var(--stamp-dark);color:var(--stamp-dark);">🗑 Remove</button>
          <span class="enrich-status" id="enrich-status-${b.id}"></span>
        </div>
      </div>
    `;
  }

  function attachEnrichHandlers(panel){
    panel.querySelectorAll('[data-enrich]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const bid = btn.dataset.enrich;
        const book = state.books.find(b=>b.id===bid);
        const status = document.getElementById('enrich-status-'+bid);
        btn.disabled = true;
        await enrichBook(book, status, {maxRetries:1});
        btn.disabled = false;
        renderPanel();
      });
    });
    panel.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const bid = btn.dataset.delete;
        const book = state.books.find(b=>b.id===bid);
        deleteBook(book, panel);
      });
    });
  }

  // ---------- Rate tab ----------
  function renderRate(panel){
    if(!state.books.length){ panel.innerHTML = '<div class="empty">No books filed yet. Add some from "Submit Books" first.</div>'; return; }
    if(!state.name){ panel.innerHTML = '<div class="empty">Enter your name up top so your ratings are attributed correctly.</div>'; return; }
    panel.innerHTML = state.books.map(b=>{
      const mine = state.ratings.find(r=>r.bookId===b.id && r.name===state.name) || {length:3, difficulty:3, interest:3, flags:[]};
      const numRatings = ratingsFor(b.id).length;
      return `
      <div class="card" data-book="${b.id}">
        ${numRatings ? `<div class="stamp-badge">${numRatings} RATED</div>` : ''}
        <div class="dewey">${deweyFor(b.title+b.author)}</div>
        <h3>${escapeHtml(b.title)}</h3>
        <div class="author">${escapeHtml(b.author||'unknown author')}</div>
        ${b.theme ? `<div class="theme"><b>theme</b>${escapeHtml(b.theme)}</div>` : ''}
        ${b.notes ? `<div class="notes"><b>notes</b>${escapeHtml(b.notes)}</div>` : ''}
        <div class="rate-grid">
          <div class="rate-field">
            <span>Length (1 short – 5 long) <span class="range-val" id="len-val-${b.id}">${mine.length}</span></span>
            <input type="range" min="1" max="5" value="${mine.length}" id="len-${b.id}">
          </div>
          <div class="rate-field">
            <span>Difficulty (1 easy – 5 hard) <span class="range-val" id="diff-val-${b.id}">${mine.difficulty}</span></span>
            <input type="range" min="1" max="5" value="${mine.difficulty}" id="diff-${b.id}">
          </div>
          <div class="rate-field" style="grid-column:1/-1;">
            <span>Interest / your vote (1 low – 5 high) <span class="range-val" id="int-val-${b.id}">${mine.interest}</span></span>
            <input type="range" min="1" max="5" value="${mine.interest}" id="int-${b.id}">
          </div>
          <div class="rate-field" style="grid-column:1/-1;">
            <span>Content flags</span>
            <div class="flags">
              ${CONTENT_FLAGS.map(f=>`<label><input type="checkbox" data-flag="${f}" ${mine.flags.includes(f)?'checked':''}> ${f}</label>`).join('')}
            </div>
          </div>
        </div>
        <div class="save-row"><button class="btn btn-primary" data-save="${b.id}">Save Rating</button></div>
      </div>
      `;
    }).join('');

    state.books.forEach(b=>{
      ['len','diff','int'].forEach(k=>{
        const el = document.getElementById(k+'-'+b.id);
        const val = document.getElementById(k+'-val-'+b.id);
        el.addEventListener('input', ()=>{ val.textContent = el.value; });
      });
    });

    panel.querySelectorAll('[data-save]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const bid = btn.dataset.save;
        const flags = Array.from(panel.querySelectorAll(`[data-book="${bid}"] [data-flag]:checked`)).map(el=>el.dataset.flag);
        const rating = {
          bookId: bid, name: state.name,
          length: Number(document.getElementById('len-'+bid).value),
          difficulty: Number(document.getElementById('diff-'+bid).value),
          interest: Number(document.getElementById('int-'+bid).value),
          flags, ts: Date.now()
        };
        btn.textContent = 'Saving…'; btn.disabled = true;
        try{
          await saveRating(rating);
          const idx = state.ratings.findIndex(r=>r.bookId===bid && r.name===state.name);
          if(idx>=0) state.ratings[idx] = rating; else state.ratings.push(rating);
          btn.textContent = 'Saved ✓';
          setTimeout(()=>{ btn.textContent='Save Rating'; btn.disabled=false; }, 900);
        }catch(e){
          console.error('saveRating failed', e);
          btn.textContent = 'Save Rating'; btn.disabled = false;
          alert("Couldn't save this rating. Storage isn't available right now.");
        }
      });
    });
  }

  // ---------- Results tab ----------
  function renderResults(panel){
    if(!state.books.length){ panel.innerHTML = '<div class="empty">Nothing to rank yet — file a book first.</div>'; return; }
    const rows = state.books.map(b=>{
      const rs = ratingsFor(b.id);
      const votes = rs.length;
      const avgLen = avg(rs.map(r=>r.length));
      const avgDiff = avg(rs.map(r=>r.difficulty));
      const avgInt = avg(rs.map(r=>r.interest));
      const flagCounts = {};
      rs.forEach(r=> (r.flags||[]).forEach(f=> flagCounts[f]=(flagCounts[f]||0)+1));
      return {book:b, votes, avgLen, avgDiff, avgInt, flagCounts};
    });
    const maxVotes = Math.max(1, ...rows.map(r=>r.votes));
    function score(r){
      const w = state.weights;
      const ease = r.votes ? (6 - r.avgDiff) : 0;
      const popularity = (r.votes / maxVotes) * 5;
      const interest = r.avgInt;
      return (w.interest*interest + w.ease*ease + w.votes*popularity) / (w.interest+w.ease+w.votes || 1);
    }
    rows.forEach(r=> r._score = score(r));
    rows.sort((a,b)=> b._score - a._score);

    panel.innerHTML = `
      <div class="weight-panel">
        <div class="wf"><span>Weight: Interest ${state.weights.interest.toFixed(1)}</span><input type="range" min="0" max="2" step="0.1" value="${state.weights.interest}" id="w-interest"></div>
        <div class="wf"><span>Weight: Easiness ${state.weights.ease.toFixed(1)}</span><input type="range" min="0" max="2" step="0.1" value="${state.weights.ease}" id="w-ease"></div>
        <div class="wf"><span>Weight: Popularity ${state.weights.votes.toFixed(1)}</span><input type="range" min="0" max="2" step="0.1" value="${state.weights.votes}" id="w-votes"></div>
      </div>
      ${rows.map((r,i)=>`
        <div class="results-card">
          <h3><span class="rank-num">#${i+1}</span>${escapeHtml(r.book.title)} <span style="font-size:12px;color:#8a8262;font-style:italic;">— ${escapeHtml(r.book.author||'')}</span></h3>
          <div class="stat-row">
            <div class="stat"><span class="num">${r._score.toFixed(2)}</span><span class="lbl">weighted score</span></div>
            <div class="stat"><span class="num">${r.votes}</span><span class="lbl">votes</span></div>
            <div class="stat"><span class="num">${r.avgInt.toFixed(1)}</span><span class="lbl">avg interest</span></div>
            <div class="stat"><span class="num">${r.avgLen.toFixed(1)}</span><span class="lbl">avg length</span></div>
            <div class="stat"><span class="num">${r.avgDiff.toFixed(1)}</span><span class="lbl">avg difficulty</span></div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, r._score/5*100)}%"></div></div>
          ${Object.keys(r.flagCounts).length ? `<div style="margin-top:8px;">${Object.entries(r.flagCounts).map(([f,c])=>`<span class="flagchip">${f} · ${c}</span>`).join('')}</div>` : ''}
        </div>
      `).join('')}
    `;
    ['interest','ease','votes'].forEach(k=>{
      document.getElementById('w-'+k).addEventListener('input', e=>{ state.weights[k] = Number(e.target.value); renderResults(panel); });
    });
  }

  // wrap renderSubmit to also attach enrich handlers after render
  const _renderSubmit = renderSubmit;
  renderSubmit = function(panel){ _renderSubmit(panel); attachEnrichHandlers(panel); };

  // ---------- boot ----------
  function checkApiConfigured(){
    if(!API_URL || API_URL.indexOf('https://script.google.com/macros/s/AKfycbxfawKZUX_NPT5cwWGewvoKf1hPtSo1cMbrg1dEMqUJktHo91KTJeDs-UBHZjsXWCYl/exec') >= 0){
      const root = document.getElementById('root');
      root.innerHTML = `<div class="wrap"><div class="banner-error"><b>This app isn't connected to a backend yet.</b><br>Open this HTML file, find the line near the top of the script that says <code>const API_URL = "PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE"</code>, and replace it with your deployed Google Apps Script Web App URL. See the setup guide for how to get that URL.</div></div>`;
      return false;
    }
    return true;
  }

  if(checkApiConfigured()){
    loadCatalogs().then(()=>{
      if(state.apiError){
        const root = document.getElementById('root');
        root.innerHTML = `<div class="wrap"><div class="banner-error"><b>Couldn't reach the backend.</b><br>${escapeHtml(state.apiError)}<br>Double-check the deployed Web App URL and that it's deployed with "Who has access: Anyone".</div></div>`;
        return;
      }
      render();
    });
  }
})();
</script>
</body>
</html>
